plugins {
    alias(libs.plugins.android.application)
    // app/google-services.json(Firebase 앱 설정, 비밀 아님)을 읽는다. 서버 서비스 계정 키와는 다르다
    alias(libs.plugins.google.services)
}

// 서버 주소는 저장소에 두지 않는다. android/local.properties에
// jeongjungang.apiBaseUrl=https://.../api/v1 를 넣으면 서버를 쓰고, 없으면 번들 역 이름 검색을 쓴다.
// 에뮬레이터에서 내 PC 서버를 쓸 때는 adb reverse tcp:8080 tcp:8080 후 http://localhost:8080/api/v1
// (디버그 빌드만 http 허용. 이유는 src/debug/res/xml/network_security_config.xml 참고)
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def apiBaseUrl = localProps.getProperty('jeongjungang.apiBaseUrl', '').trim()
// 카카오맵 SDK 네이티브 앱 키도 local.properties에 둔다: jeongjungang.kakaoNativeAppKey=...
// 없으면 지도만 안 뜨고 나머지는 그대로 동작한다(KakaoMaps.isAvailable()이 false).
// 키는 카카오 콘솔에 등록한 패키지명·키 해시로 서명된 앱에서만 쓰인다.
def kakaoNativeAppKey = localProps.getProperty('jeongjungang.kakaoNativeAppKey', '').trim()

android {
    namespace 'com.jeongjungang'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId "com.jeongjungang"
        minSdk 26
        targetSdk 37
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "API_BASE_URL", "\"${apiBaseUrl}\""
        buildConfigField "String", "KAKAO_NATIVE_APP_KEY", "\"${kakaoNativeAppKey}\""

        // 카카오맵 엔진은 ARM 라이브러리만 있다. 다른 라이브러리(Firebase 등)가 x86용을 같이 넣으면
        // x86_64 에뮬레이터가 앱을 x86으로 설치해서 지도 엔진을 못 찾는다(지도만 꺼짐).
        // ARM만 넣으면 에뮬레이터는 ARM 번역으로 전부 돌리고, 실기기(ARM)는 그대로다. APK도 작아진다.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            optimization {
                enable false
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

// 실제 서버 연동 테스트(LiveServerContractTest): gradlew testDebugUnitTest -PliveServer=http://localhost:8080/api/v1
tasks.withType(Test).configureEach {
    if (project.hasProperty('liveServer')) {
        systemProperty 'liveServer', project.property('liveServer')
    }
}

dependencies {
    implementation libs.activity
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material
    // 서버 호출 (HttpURLConnection은 PATCH를 못 보낸다)
    implementation libs.okhttp
    // 알람 끔 기록 재전송 (앱 종료·재부팅 뒤에도 네트워크가 돌아오면 실행)
    implementation libs.work.runtime
    // 지도 (ARM 전용 네이티브 라이브러리. x86_64 에뮬레이터는 API 30+ 이미지의 ARM 번역으로 돈다)
    implementation libs.kakao.map
    // 책임 알람 푸시 수신 (docs/API.md 8절)
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.messaging
    testImplementation libs.junit
    // Android의 org.json은 단위 테스트에서 스텁이라, JVM 테스트용 실제 구현을 넣는다.
    testImplementation libs.json
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
}