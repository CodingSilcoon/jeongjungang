# Caddy 뒤에서 X-Forwarded-For로 실제 IP를 얻는다. 내부망(사설 IP) 프록시가 보낸 헤더만 믿는다
server:
  forward-headers-strategy: native

spring:
  application:
    name: jeongjungang-backend
  # 배포에서는 환경변수로 주입한다. 로컬 bootRun은 compose.yaml 연결 정보가 이 값을 덮어쓴다
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jeongjungang}
    username: ${DB_USERNAME:jeongjungang}
    password: ${DB_PASSWORD:}
  jpa:
    # 스키마는 Flyway 마이그레이션만 바꾼다. 엔티티와 어긋나면 시작할 때 실패한다
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  docker:
    compose:
      # 서버를 끄면 컨테이너도 멈추고, 데이터 볼륨은 남긴다
      lifecycle-management: start-and-stop

jeongjungang:
  # 초대 링크 앞부분. 배포에서는 https://{도메인}으로 준다
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  # 기한이 지난 약속을 지우는 주기
  retention-interval: PT10M
  kakao:
    # 키는 환경변수로만 넣는다. 저장소에 두지 않는다
    rest-api-key: ${KAKAO_REST_API_KEY:}
    base-url: https://dapi.kakao.com
    connect-timeout: 2s
    read-timeout: 3s

# 운영 점검용 actuator는 health만 열고, 세부 정보는 숨긴다
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
