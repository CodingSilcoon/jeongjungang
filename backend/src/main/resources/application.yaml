spring:
  application:
    name: jeongjungang-backend
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# 운영 점검용 actuator는 health만 열고, 세부 정보는 숨긴다
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
