#jj-six .direction{min-width:0}
#jj-six .caption{margin:0 auto 18px;max-width:390px;color:light-dark(#24272C,#F1F2F4)}

#jj-six .choice.main:hover{background:var(--accent);border-color:var(--accent)}
#jj-six .choice[aria-pressed=true]{outline:2px solid var(--ink);outline-offset:3px}
#jj-six .phone h2{font-size:32px;line-height:1.4}

#jj-six .yellow{--bg:#FFFDF2;--ink:#24271F;--muted:#5E604D;--accent:#F9DA49;--on:#24271F;--surface:#fff;--line:#24271F;--radius:12px;--shadow:4px 4px 0 #24271F}

#jj-six .mono{--bg:#fff;--ink:#17191C;--muted:#64676C;--accent:#17191C;--on:#fff;--surface:#fff;--line:#C9CDD2;--radius:6px;--shadow:none}

#jj-six .mono .choice strong{font-weight:700}
#jj-six .night{--bg:#151C1B;--ink:#EDF5EA;--muted:#ADBDB4;--accent:#C3F269;--on:#20311B;--surface:#202B27;--line:#3B4C43;--radius:22px;--shadow:0 0 22px #C3F26910}
