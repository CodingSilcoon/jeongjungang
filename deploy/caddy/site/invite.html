<!doctype html>
<!-- 초대 링크 https://{도메인}/m/{코드}를 앱이 아닌 브라우저에서 열었을 때 보이는 페이지.
     약속 미리보기는 GET /api/v1/meetings/by-code/{코드}로 받는다(공개 API). 내용은 invite.js가 채운다 -->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>정중앙 초대</title>
  <style>
    :root {
      --bg: #f6f4ef;
      --card: #ffffff;
      --text: #1d1d1b;
      --muted: #6b6a66;
      --accent: #2f6b4f;
      --line: #e3e0d8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161614;
        --card: #22221f;
        --text: #f1efe9;
        --muted: #a5a39c;
        --accent: #7cc4a0;
        --line: #36352f;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }
    main {
      width: 100%;
      max-width: 400px;
      padding: 28px 24px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--card);
    }
    .brand { margin: 0 0 20px; font-size: 14px; font-weight: 700; color: var(--accent); }
    h1 { margin: 0 0 8px; font-size: 24px; line-height: 1.3; word-break: keep-all; }
    .meta { margin: 0 0 24px; color: var(--muted); line-height: 1.6; }
    .code-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border: 1px dashed var(--line);
      border-radius: 12px;
    }
    .code { font-size: 22px; font-weight: 700; letter-spacing: 0.12em; font-variant-numeric: tabular-nums; }
    button {
      padding: 8px 14px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: var(--card);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
    .help { margin: 20px 0 0; font-size: 14px; color: var(--muted); line-height: 1.6; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <p class="brand">정중앙</p>
    <h1 id="title">초대를 확인하고 있어요</h1>
    <p class="meta" id="meta"></p>
    <div class="code-box" id="code-box" hidden>
      <span class="code" id="code"></span>
      <button type="button" id="copy">링크 복사</button>
    </div>
    <p class="help" id="help" hidden>
      정중앙 앱을 열고 <strong>코드로 참가</strong>에 이 코드나 링크를 붙여 넣으세요.
      앱이 설치돼 있는데 이 화면이 보이면, 링크를 길게 눌러 앱으로 열어 보세요.
    </p>
  </main>
  <script src="/m/invite.js"></script>
</body>
</html>
