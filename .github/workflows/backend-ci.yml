# 서버(backend/, deploy/) 테스트, 운영 이미지 빌드, main이면 GHCR에 이미지 업로드. 해당 폴더가 바뀐 경우에만 돈다
name: backend-ci

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'deploy/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'deploy/**'
      - '.github/workflows/backend-ci.yml'

# 같은 PR에 새 커밋이 오면 이전 실행은 취소한다
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Gradle 의존성·빌드 캐시. 두 번째 실행부터 빨라진다
      - uses: gradle/actions/setup-gradle@v6

      # ubuntu 러너에는 Docker가 있어서 Testcontainers 통합 테스트도 건너뛰지 않고 돈다
      - name: Test
        run: ./gradlew test

      # Docker가 없으면 통합 테스트가 조용히 건너뛰므로, 건너뛴 테스트가 있으면 실패시킨다
      - name: Check skipped tests
        run: |
          total=$(cat build/test-results/test/*.xml | grep -o 'tests="[0-9]*"' | grep -o '[0-9]*' | paste -sd+ | bc)
          skipped=$(cat build/test-results/test/*.xml | grep -o 'skipped="[0-9]*"' | grep -o '[0-9]*' | paste -sd+ | bc)
          echo "테스트 ${total}개, 건너뜀 ${skipped}개" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$skipped" -eq 0

      # 실패하면 Actions 실행 화면의 Artifacts에서 HTML 리포트를 받아 볼 수 있다
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test
          retention-days: 7

  # 운영 이미지가 빌드되고 compose 설정이 올바른지 확인한다 (테스트는 위 job이 한다)
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Check compose config
        working-directory: deploy
        run: |
          DOMAIN=example.com DB_PASSWORD=ci docker compose config --quiet
          DOMAIN=example.com DB_PASSWORD=ci docker compose -f compose.yaml -f compose.local.yaml config --quiet

      - uses: docker/setup-buildx-action@v4

      # 빌드 캐시를 GitHub에 두어 아래 publish job이 다시 빌드하지 않고 재사용한다
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: backend
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # main에 들어간 코드만 GHCR에 올린다. 서버는 이 이미지를 받아서 실행한다 (서버에서는 빌드하지 않음)
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest와 커밋별 태그(sha-xxxxxxx). 문제가 생기면 이전 sha 태그로 되돌린다
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/codingsilcoon/jeongjungang-backend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v7
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
