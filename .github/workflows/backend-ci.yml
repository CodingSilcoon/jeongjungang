# 서버(backend/) 테스트. PR과 main push 때, backend/가 바뀐 경우에만 돈다
name: backend-ci

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

# 같은 PR에 새 커밋이 오면 이전 실행은 취소한다
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Gradle 의존성·빌드 캐시. 두 번째 실행부터 빨라진다
      - uses: gradle/actions/setup-gradle@v6

      # ubuntu 러너에는 Docker가 있어서 Testcontainers 통합 테스트도 건너뛰지 않고 돈다
      - name: Test
        run: ./gradlew test

      # Docker가 없으면 통합 테스트가 조용히 건너뛰므로, 건너뛴 테스트가 있으면 실패시킨다
      - name: Check skipped tests
        run: |
          total=$(cat build/test-results/test/*.xml | grep -o 'tests="[0-9]*"' | grep -o '[0-9]*' | paste -sd+ | bc)
          skipped=$(cat build/test-results/test/*.xml | grep -o 'skipped="[0-9]*"' | grep -o '[0-9]*' | paste -sd+ | bc)
          echo "테스트 ${total}개, 건너뜀 ${skipped}개" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$skipped" -eq 0

      # 실패하면 Actions 실행 화면의 Artifacts에서 HTML 리포트를 받아 볼 수 있다
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test
          retention-days: 7
